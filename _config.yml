collections_dir: content

highlighter: rouge
markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false

collections:
  getting-started:
    output: true
  guides:
    output: true
  references:
    output: true
  components:
    output: true
  releases:
    output: true
  comp-releases:
    output: true
  admin:
    output: true
  developers:
    output: true
     
plugins:
  - jekyll-redirect-from

exclude:

  - .jekyll-cache
  # repo housekeeping, not site content (debrand-inventory.md is an internal working note)
  - Dockerfile
  - README.md
  - start.sh
  - debrand-inventory.md
